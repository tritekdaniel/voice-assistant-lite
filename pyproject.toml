[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalis"
version = "0.1.0"
description = "Voice-first desktop assistant for local LLMs (OpenAI-compatible chat completions)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "faster-whisper>=1.0",
  "openwakeword>=0.6",
  "onnxruntime>=1.17",
  "kokoro>=0.2",
  "piper-tts>=1.2",
  "openai>=1.30",
  "sounddevice>=0.5",
  "PySide6>=6.6",
  "platformdirs>=4",
  "tomli-w>=1.0",
  "soundfile>=0.12",
  "miniaudio>=1.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vocalis = "vocalis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
